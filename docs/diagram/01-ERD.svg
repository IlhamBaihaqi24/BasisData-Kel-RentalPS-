<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="820" viewBox="0 0 1260 820" font-family="Segoe UI, Arial, sans-serif"><rect width="1260" height="820" fill="#FFFFFF"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="block" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11z" fill="#FFFFFF" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1 6 L7 1 L13 6 L7 11z" fill="#6B6590" stroke="#6B6590"/></marker></defs><text font-size="18" font-weight="700" fill="#241A52" text-anchor="start"><tspan x="30" y="35.3">ERD TitikTemu (revisi: customer memesan sendiri, admin memverifikasi pembayaran)</tspan></text><rect x="40" y="70" width="270" height="134" rx="8" fill="#FFFFFF" stroke="#6C4DF5" stroke-width="1.5"/><rect x="40" y="70" width="270" height="32" rx="8" fill="#6C4DF5" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="175.0" y="90.9">Pelanggan</tspan></text><rect x="40" y="102" width="270" height="102" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="50" y="124.0">PK  id_pelanggan : TEXT</tspan><tspan x="50" y="140.2">     nama : TEXT</tspan><tspan x="50" y="156.4">UQ  no_hp : TEXT</tspan><tspan x="50" y="172.6">     alamat : TEXT</tspan></text><rect x="40" y="300" width="270" height="134" rx="8" fill="#FFFFFF" stroke="#6C4DF5" stroke-width="1.5"/><rect x="40" y="300" width="270" height="32" rx="8" fill="#6C4DF5" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="175.0" y="320.9">Unit_PS</tspan></text><rect x="40" y="332" width="270" height="102" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="50" y="354.0">PK  id_unit : TEXT</tspan><tspan x="50" y="370.2">     jenis : PS5 | PS4</tspan><tspan x="50" y="386.4">     nomor : INTEGER</tspan><tspan x="50" y="402.6">     kondisi : baik | rusak ringan</tspan></text><rect x="40" y="520" width="270" height="178" rx="8" fill="#FFFFFF" stroke="#FF7A59" stroke-width="1.5"/><rect x="40" y="520" width="270" height="32" rx="8" fill="#FF7A59" stroke="#FF7A59" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="175.0" y="540.9">Ruangan</tspan></text><rect x="40" y="552" width="270" height="146" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="50" y="574.0">PK  id_ruangan : TEXT</tspan><tspan x="50" y="590.2">UQ  nama : TEXT</tspan><tspan x="50" y="606.4">     tipe : VVIP | VIP | Reguler</tspan><tspan x="50" y="622.6">     kapasitas : INTEGER</tspan><tspan x="50" y="638.8">     tarif_tambahan : INTEGER</tspan><tspan x="50" y="655.0">     fasilitas : TEXT</tspan></text><rect x="500" y="250" width="300" height="200" rx="8" fill="#FFFFFF" stroke="#4B2FD0" stroke-width="1.5"/><rect x="500" y="250" width="300" height="32" rx="8" fill="#4B2FD0" stroke="#4B2FD0" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="650.0" y="270.9">Penyewaan</tspan></text><rect x="500" y="282" width="300" height="168" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="510" y="304.0">PK  id_sewa : TEXT</tspan><tspan x="510" y="320.2">FK  id_pelanggan : TEXT</tspan><tspan x="510" y="336.4">FK  id_unit : TEXT</tspan><tspan x="510" y="352.6">FK  id_ruangan : TEXT</tspan><tspan x="510" y="368.8">     mulai : INTEGER (timestamp)</tspan><tspan x="510" y="385.0">     durasi : INTEGER (jam)</tspan><tspan x="510" y="401.2">     total : INTEGER</tspan></text><rect x="930" y="250" width="290" height="226" rx="8" fill="#FFFFFF" stroke="#0B8F6E" stroke-width="1.5"/><rect x="930" y="250" width="290" height="32" rx="8" fill="#0B8F6E" stroke="#0B8F6E" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1075.0" y="270.9">Pembayaran</tspan></text><rect x="930" y="282" width="290" height="194" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="940" y="304.0">PK  id_bayar : TEXT</tspan><tspan x="940" y="320.2">FK  id_sewa : TEXT (UNIQUE)</tspan><tspan x="940" y="336.4">     tanggal : INTEGER</tspan><tspan x="940" y="352.6">     metode : Tunai | Transfer | QRIS</tspan><tspan x="940" y="368.8">     jumlah : INTEGER</tspan><tspan x="940" y="385.0">     status : Menunggu | Verifikasi</tspan><tspan x="940" y="401.2">                 | Lunas | Ditolak</tspan><tspan x="940" y="417.4">     bukti : TEXT (nama file foto)</tspan><tspan x="940" y="433.6">     alasan : TEXT (alasan ditolak)</tspan></text><rect x="500" y="600" width="300" height="134" rx="8" fill="#FFFFFF" stroke="#7A5600" stroke-width="1.5"/><rect x="500" y="600" width="300" height="32" rx="8" fill="#7A5600" stroke="#7A5600" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="650.0" y="620.9">Pegawai (admin)</tspan></text><rect x="500" y="632" width="300" height="102" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="510" y="654.0">PK  id_pegawai : TEXT</tspan><tspan x="510" y="670.2">UQ  username : TEXT</tspan><tspan x="510" y="686.4">     pin : TEXT</tspan><tspan x="510" y="702.6">     nama : TEXT</tspan></text><rect x="930" y="600" width="290" height="90" rx="8" fill="#FFFFFF" stroke="#6B6590" stroke-width="1.5"/><rect x="930" y="600" width="290" height="32" rx="8" fill="#6B6590" stroke="#6B6590" stroke-width="1.5"/><text font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1075.0" y="620.9">Pengaturan</tspan></text><rect x="930" y="632" width="290" height="58" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text font-size="12" fill="#241A52" text-anchor="start"><tspan x="940" y="654.0">PK  kunci : TEXT</tspan><tspan x="940" y="670.2">     nilai : JSON (tarif, rekening, QRIS)</tspan></text><path d="M310.0 197.5 L500.0 282.7" fill="none" stroke="#8F86C9" stroke-width="1.6"/><path d="M317.7 209.7 L324.2 195.1 M323.2 212.2 L329.7 197.6" fill="none" stroke="#241A52" stroke-width="1.8"/><path d="M485.4 276.2 L496.3 290.9 M485.4 276.2 L500.0 282.7 M485.4 276.2 L503.7 274.5 M485.0 267.3 L478.5 281.9" fill="none" stroke="#241A52" stroke-width="1.8"/><rect x="373.8" y="223.1" width="62.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="405.0" y="236.1" font-size="11" text-anchor="middle" fill="#241A52">melakukan</text><path d="M310.0 362.2 L500.0 355.4" fill="none" stroke="#8F86C9" stroke-width="1.6"/><path d="M322.3 369.7 L321.7 353.7 M328.3 369.5 L327.7 353.5" fill="none" stroke="#241A52" stroke-width="1.8"/><path d="M484.0 355.9 L500.3 364.4 M484.0 355.9 L500.0 355.4 M484.0 355.9 L499.7 346.4 M479.7 348.1 L480.3 364.1" fill="none" stroke="#241A52" stroke-width="1.8"/><rect x="364.7" y="341.8" width="80.6" height="16" fill="#fff" fill-opacity="0.85"/><text x="405.0" y="354.8" font-size="11" text-anchor="middle" fill="#241A52">dipakai pada</text><path d="M310.0 535.4 L500.0 431.8" fill="none" stroke="#8F86C9" stroke-width="1.6"/><path d="M324.4 536.7 L316.7 522.6 M329.6 533.8 L322.0 519.7" fill="none" stroke="#241A52" stroke-width="1.8"/><path d="M486.0 439.4 L504.3 439.7 M486.0 439.4 L500.0 431.8 M486.0 439.4 L495.7 423.9 M478.6 434.3 L486.3 448.4" fill="none" stroke="#241A52" stroke-width="1.8"/><rect x="373.8" y="466.6" width="62.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="405.0" y="479.6" font-size="11" text-anchor="middle" fill="#241A52">ditempati</text><path d="M800.0 346.1 L930.0 342.8" fill="none" stroke="#8F86C9" stroke-width="1.6"/><path d="M812.2 353.8 L811.8 337.8 M818.2 353.6 L817.8 337.7" fill="none" stroke="#241A52" stroke-width="1.8"/><path d="M917.8 335.1 L918.2 351.1 M911.8 335.2 L912.2 351.2" fill="none" stroke="#241A52" stroke-width="1.8"/><rect x="818.6" y="327.4" width="92.7" height="16" fill="#fff" fill-opacity="0.85"/><text x="865.0" y="340.4" font-size="11" text-anchor="middle" fill="#241A52">dibayar dengan</text><text font-size="11" fill="#6B6590" text-anchor="middle"><tspan x="645.0" y="546.4">Pegawai dan Pengaturan berdiri sendiri (tanpa relasi FK):</tspan><tspan x="645.0" y="561.3">Pegawai dipakai untuk login admin, Pengaturan menyimpan tarif PS.</tspan></text><text font-size="10.5" fill="#6B6590" text-anchor="start"><tspan x="850" y="513.2">Aturan:</tspan><tspan x="850" y="527.4">• total = (tarif PS + tarif_tambahan ruangan) x durasi</tspan><tspan x="850" y="541.6">• status sewa (Akan datang / Berlangsung / Selesai) dihitung dari mulai dan durasi, tidak disimpan</tspan><tspan x="850" y="555.8">• PS / ruangan yang sama tidak boleh tumpang tindih waktu</tspan><tspan x="850" y="570.0">• Transfer / QRIS wajib bukti: status Verifikasi, jadi Lunas</tspan><tspan x="850" y="584.2">  setelah admin menyetujui (Tunai: Menunggu, bayar di kasir)</tspan></text></svg>