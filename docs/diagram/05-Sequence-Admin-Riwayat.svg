<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="900" viewBox="0 0 1140 900" font-family="Segoe UI, Arial, sans-serif"><rect width="1140" height="900" fill="#FFFFFF"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="block" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11z" fill="#FFFFFF" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1 6 L7 1 L13 6 L7 11z" fill="#6B6590" stroke="#6B6590"/></marker></defs><text font-size="18" font-weight="700" fill="#241A52" text-anchor="start"><tspan x="30" y="28.3">Sequence Diagram: Admin melihat riwayat pesanan</tspan></text><rect x="55" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="130.0" y="67.2">Admin</tspan></text><path d="M130.0 82.0 L130.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="335" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="410.0" y="67.2">Frontend (Browser)</tspan></text><path d="M410.0 82.0 L410.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="625" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="700.0" y="67.2">Backend (API)</tspan></text><path d="M700.0 82.0 L700.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="915" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="990.0" y="67.2">Database</tspan></text><path d="M990.0 82.0 L990.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M130.0 118.0 L410.0 118.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="160.1" y="101.0" width="219.8" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="114.0" font-size="11" text-anchor="middle" fill="#241A52">1. Buka halaman admin, isi ID + PIN</text><path d="M410.0 154.0 L700.0 154.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="481.4" y="137.0" width="147.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="150.0" font-size="11" text-anchor="middle" fill="#241A52">2. POST /api/auth/login</text><path d="M700.0 190.0 L990.0 190.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="744.2" y="173.0" width="201.6" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="186.0" font-size="11" text-anchor="middle" fill="#241A52">3. SELECT pegawai WHERE username</text><path d="M990.0 226.0 L700.0 226.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="795.6" y="209.0" width="98.8" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="222.0" font-size="11" text-anchor="middle" fill="#241A52">4. data pegawai</text><rect x="40" y="248" width="1080" height="100" rx="0" fill="none" stroke="#8F86C9" stroke-width="1.5"/><rect x="40" y="248" width="48" height="22" rx="0" fill="#E9E3FF" stroke="#8F86C9" stroke-width="1.5"/><text font-size="11" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="64.0" y="262.9">alt</tspan></text><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="94" y="262.9">[ID dan PIN benar]</tspan></text><path d="M40.0 310.0 L1120.0 310.0" fill="none" stroke="#8F86C9" stroke-width="1.6" stroke-dasharray="6 5"/><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="46" y="325.9">[salah]</tspan></text><path d="M700.0 276.0 L410.0 276.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="508.6" y="259.0" width="92.7" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="272.0" font-size="11" text-anchor="middle" fill="#241A52">5. 200 {token}</text><path d="M700.0 330.0 L410.0 330.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="454.2" y="313.0" width="201.6" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="326.0" font-size="11" text-anchor="middle" fill="#241A52">6. 401 ID pegawai atau PIN salah</text><path d="M410.0 388.0 L700.0 388.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="351.4" y="371.0" width="407.3" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="384.0" font-size="11" text-anchor="middle" fill="#241A52">7. GET /api/admin/ringkasan dan /api/admin/riwayat  (Bearer token)</text><path d="M700.0 424.0 L740.0 424.0 L740.0 446.0 L700.0 446.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><text font-size="11" fill="#241A52" text-anchor="start"><tspan x="746" y="434.9">8. requireAuth: cek token</tspan></text><path d="M700.0 468.0 L990.0 468.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="656.5" y="451.0" width="377.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="464.0" font-size="11" text-anchor="middle" fill="#241A52">9. SELECT penyewaan JOIN pelanggan, unit, ruangan, pembayaran</text><path d="M990.0 504.0 L700.0 504.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="789.6" y="487.0" width="110.9" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="500.0" font-size="11" text-anchor="middle" fill="#241A52">10. baris riwayat</text><path d="M700.0 540.0 L410.0 540.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="411.9" y="523.0" width="286.3" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="536.0" font-size="11" text-anchor="middle" fill="#241A52">11. 200 [riwayat + status dihitung dari waktu]</text><path d="M410.0 576.0 L130.0 576.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="142.0" y="559.0" width="256.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="572.0" font-size="11" text-anchor="middle" fill="#241A52">12. Tampilkan ringkasan dan tabel riwayat</text><path d="M130.0 612.0 L410.0 612.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="160.1" y="595.0" width="219.8" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="608.0" font-size="11" text-anchor="middle" fill="#241A52">13. Cari / filter / klik satu baris</text><path d="M410.0 648.0 L700.0 648.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="393.7" y="631.0" width="322.6" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="644.0" font-size="11" text-anchor="middle" fill="#241A52">14. GET /api/admin/riwayat?q=...  atau  /riwayat/:id</text><path d="M700.0 684.0 L990.0 684.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="768.4" y="667.0" width="153.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="680.0" font-size="11" text-anchor="middle" fill="#241A52">15. SELECT ... WHERE ...</text><path d="M990.0 720.0 L700.0 720.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="813.8" y="703.0" width="62.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="716.0" font-size="11" text-anchor="middle" fill="#241A52">16. hasil</text><path d="M700.0 756.0 L410.0 756.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="478.4" y="739.0" width="153.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="752.0" font-size="11" text-anchor="middle" fill="#241A52">17. 200 [hasil / detail]</text><path d="M410.0 792.0 L130.0 792.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="148.0" y="775.0" width="244.0" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="788.0" font-size="11" text-anchor="middle" fill="#241A52">18. Tampilkan hasil atau detail pesanan</text></svg>