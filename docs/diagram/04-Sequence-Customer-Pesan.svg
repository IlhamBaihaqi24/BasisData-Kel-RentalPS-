<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1010" viewBox="0 0 1140 1010" font-family="Segoe UI, Arial, sans-serif"><rect width="1140" height="1010" fill="#FFFFFF"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="block" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11z" fill="#FFFFFF" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1 6 L7 1 L13 6 L7 11z" fill="#6B6590" stroke="#6B6590"/></marker></defs><text font-size="18" font-weight="700" fill="#241A52" text-anchor="start"><tspan x="30" y="28.3">Sequence Diagram: Customer memesan PS</tspan></text><rect x="55" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="130.0" y="67.2">Customer</tspan></text><path d="M130.0 82.0 L130.0 990.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="335" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="410.0" y="67.2">Frontend (Browser)</tspan></text><path d="M410.0 82.0 L410.0 990.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="625" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="700.0" y="67.2">Backend (API)</tspan></text><path d="M700.0 82.0 L700.0 990.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="915" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="990.0" y="67.2">Database</tspan></text><path d="M990.0 82.0 L990.0 990.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M130.0 118.0 L410.0 118.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="148.0" y="101.0" width="244.0" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="114.0" font-size="11" text-anchor="middle" fill="#241A52">1. Buka TitikTemu, tekan Pesan sekarang</text><path d="M130.0 154.0 L410.0 154.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="184.3" y="137.0" width="171.4" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="150.0" font-size="11" text-anchor="middle" fill="#241A52">2. Isi nama, no. HP, alamat</text><path d="M410.0 190.0 L700.0 190.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="442.1" y="173.0" width="225.8" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="186.0" font-size="11" text-anchor="middle" fill="#241A52">3. GET /api/publik/unit?mulai&amp;durasi</text><path d="M700.0 226.0 L990.0 226.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="726.0" y="209.0" width="237.9" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="222.0" font-size="11" text-anchor="middle" fill="#241A52">4. SELECT unit_ps + cek jadwal bentrok</text><path d="M990.0 262.0 L700.0 262.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="798.6" y="245.0" width="92.7" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="258.0" font-size="11" text-anchor="middle" fill="#241A52">5. daftar unit</text><path d="M700.0 298.0 L410.0 298.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="478.4" y="281.0" width="153.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="294.0" font-size="11" text-anchor="middle" fill="#241A52">6. 200 [unit + tersedia]</text><path d="M130.0 334.0 L410.0 334.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="175.2" y="317.0" width="189.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="330.0" font-size="11" text-anchor="middle" fill="#241A52">7. Pilih hari, jam, durasi, PS</text><path d="M410.0 370.0 L700.0 370.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="433.0" y="353.0" width="244.0" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="366.0" font-size="11" text-anchor="middle" fill="#241A52">8. GET /api/publik/ruangan?mulai&amp;durasi</text><path d="M700.0 406.0 L990.0 406.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="726.0" y="389.0" width="237.9" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="402.0" font-size="11" text-anchor="middle" fill="#241A52">9. SELECT ruangan + cek jadwal bentrok</text><path d="M990.0 442.0 L700.0 442.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="786.5" y="425.0" width="116.9" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="438.0" font-size="11" text-anchor="middle" fill="#241A52">10. daftar ruangan</text><path d="M700.0 478.0 L410.0 478.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="466.3" y="461.0" width="177.4" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="474.0" font-size="11" text-anchor="middle" fill="#241A52">11. 200 [ruangan + tersedia]</text><path d="M130.0 514.0 L410.0 514.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="128.6" y="497.0" width="282.9" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="510.0" font-size="11" text-anchor="middle" fill="#241A52">12. Pilih ruangan, metode, unggah bukti bayar</text><path d="M410.0 550.0 L700.0 550.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="422.9" y="533.0" width="264.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="546.0" font-size="11" text-anchor="middle" fill="#241A52">13. POST /api/publik/pesanan (+ buktiData)</text><path d="M700.0 586.0 L740.0 586.0 L740.0 608.0 L700.0 608.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><text font-size="11" fill="#241A52" text-anchor="start"><tspan x="746" y="596.9">14. validasi data, hitung total</tspan></text><path d="M700.0 630.0 L990.0 630.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="750.2" y="613.0" width="189.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="626.0" font-size="11" text-anchor="middle" fill="#241A52">15. cek bentrok PS dan ruangan</text><path d="M990.0 666.0 L700.0 666.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="801.7" y="649.0" width="86.7" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="662.0" font-size="11" text-anchor="middle" fill="#241A52">16. hasil cek</text><rect x="40" y="688" width="1080" height="190" rx="0" fill="none" stroke="#8F86C9" stroke-width="1.5"/><rect x="40" y="688" width="48" height="22" rx="0" fill="#E9E3FF" stroke="#8F86C9" stroke-width="1.5"/><text font-size="11" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="64.0" y="702.9">alt</tspan></text><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="94" y="702.9">[tidak bentrok]</tspan></text><path d="M40.0 824.0 L1120.0 824.0" fill="none" stroke="#8F86C9" stroke-width="1.6" stroke-dasharray="6 5"/><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="46" y="839.9">[bentrok]</tspan></text><path d="M700.0 716.0 L990.0 716.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="584.1" y="699.0" width="521.8" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="712.0" font-size="11" text-anchor="middle" fill="#241A52">17. BEGIN; cari/buat pelanggan; INSERT penyewaan; INSERT pembayaran + bukti; COMMIT</text><path d="M990.0 764.0 L700.0 764.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="822.9" y="747.0" width="44.3" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="760.0" font-size="11" text-anchor="middle" fill="#241A52">18. OK</text><path d="M700.0 800.0 L410.0 800.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="422.9" y="783.0" width="264.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="796.0" font-size="11" text-anchor="middle" fill="#241A52">19. 201 Created {struk, status Verifikasi}</text><path d="M700.0 860.0 L410.0 860.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="399.8" y="843.0" width="310.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="856.0" font-size="11" text-anchor="middle" fill="#241A52">20. 409 Conflict {error: PS/ruangan sudah dipesan}</text><path d="M410.0 908.0 L130.0 908.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="137.9" y="891.0" width="264.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="904.0" font-size="11" text-anchor="middle" fill="#241A52">21. Struk: Menunggu verifikasi, atau error</text></svg>