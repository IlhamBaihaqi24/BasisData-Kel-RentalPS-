<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="900" viewBox="0 0 1140 900" font-family="Segoe UI, Arial, sans-serif"><rect width="1140" height="900" fill="#FFFFFF"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="block" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11z" fill="#FFFFFF" stroke="#6B6590" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="14" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1 6 L7 1 L13 6 L7 11z" fill="#6B6590" stroke="#6B6590"/></marker></defs><text font-size="18" font-weight="700" fill="#241A52" text-anchor="start"><tspan x="30" y="28.3">Sequence Diagram: Admin memverifikasi pembayaran (Transfer / QRIS)</tspan></text><rect x="55" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="130.0" y="67.2">Admin</tspan></text><path d="M130.0 82.0 L130.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="335" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="410.0" y="67.2">Frontend (Browser)</tspan></text><path d="M410.0 82.0 L410.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="625" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="700.0" y="67.2">Backend (API)</tspan></text><path d="M700.0 82.0 L700.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="915" y="44" width="150" height="38" rx="8" fill="#E9E3FF" stroke="#6C4DF5" stroke-width="1.5"/><text font-size="12" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="990.0" y="67.2">Database</tspan></text><path d="M990.0 82.0 L990.0 880.0" fill="none" stroke="#B7AEE6" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M130.0 118.0 L410.0 118.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="160.0" y="101.0" width="220.0" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="114.0" font-size="11" text-anchor="middle" fill="#241A52">1. Buka halaman admin (sudah login)</text><path d="M410.0 154.0 L700.0 154.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="419.9" y="137.0" width="270.3" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="150.0" font-size="11" text-anchor="middle" fill="#241A52">2. GET /api/admin/verifikasi (Bearer token)</text><path d="M700.0 190.0 L990.0 190.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="722.4" y="173.0" width="245.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="186.0" font-size="11" text-anchor="middle" fill="#241A52">3. SELECT ... WHERE status = Verifikasi</text><path d="M990.0 226.0 L700.0 226.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="788.4" y="209.0" width="113.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="222.0" font-size="11" text-anchor="middle" fill="#241A52">4. daftar menunggu</text><path d="M700.0 262.0 L410.0 262.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="476.4" y="245.0" width="157.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="258.0" font-size="11" text-anchor="middle" fill="#241A52">5. 200 [pesanan menunggu]</text><path d="M410.0 298.0 L130.0 298.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="150.6" y="281.0" width="238.9" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="294.0" font-size="11" text-anchor="middle" fill="#241A52">6. Tampilkan panel Menunggu verifikasi</text><path d="M130.0 334.0 L410.0 334.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="204.0" y="317.0" width="132.0" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="330.0" font-size="11" text-anchor="middle" fill="#241A52">7. Klik Periksa bukti</text><path d="M410.0 370.0 L700.0 370.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="470.1" y="353.0" width="169.7" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="366.0" font-size="11" text-anchor="middle" fill="#241A52">8. GET /api/admin/bukti/:id</text><path d="M700.0 406.0 L410.0 406.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="470.1" y="389.0" width="169.7" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="402.0" font-size="11" text-anchor="middle" fill="#241A52">9. foto bukti (hanya admin)</text><path d="M410.0 442.0 L130.0 442.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="175.7" y="425.0" width="188.6" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="438.0" font-size="11" text-anchor="middle" fill="#241A52">10. Tampilkan foto bukti bayar</text><path d="M130.0 478.0 L410.0 478.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="137.9" y="461.0" width="264.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="474.0" font-size="11" text-anchor="middle" fill="#241A52">11. Cocokkan nominal, lalu Setujui / Tolak</text><path d="M410.0 538.0 L700.0 538.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="422.9" y="521.0" width="264.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="534.0" font-size="11" text-anchor="middle" fill="#241A52">12. POST /api/admin/pembayaran/:id/setujui</text><path d="M700.0 574.0 L990.0 574.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="719.2" y="557.0" width="251.5" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="570.0" font-size="11" text-anchor="middle" fill="#241A52">13. UPDATE pembayaran SET status = Lunas</text><path d="M700.0 610.0 L410.0 610.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="441.9" y="593.0" width="226.3" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="606.0" font-size="11" text-anchor="middle" fill="#241A52">14. 200 {pesanan resmi jadi booking}</text><path d="M410.0 668.0 L700.0 668.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="400.9" y="651.0" width="308.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="664.0" font-size="11" text-anchor="middle" fill="#241A52">15. POST /api/admin/pembayaran/:id/tolak {alasan}</text><path d="M700.0 704.0 L990.0 704.0" fill="none" stroke="#241A52" stroke-width="1.6" marker-end="url(#open)"/><rect x="713.0" y="687.0" width="264.1" height="16" fill="#fff" fill-opacity="0.85"/><text x="845.0" y="700.0" font-size="11" text-anchor="middle" fill="#241A52">16. UPDATE pembayaran SET status = Ditolak</text><path d="M700.0 740.0 L410.0 740.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="476.4" y="723.0" width="157.2" height="16" fill="#fff" fill-opacity="0.85"/><text x="555.0" y="736.0" font-size="11" text-anchor="middle" fill="#241A52">17. 200 {status: Ditolak}</text><path d="M410.0 792.0 L130.0 792.0" fill="none" stroke="#241A52" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#open)"/><rect x="153.7" y="775.0" width="232.6" height="16" fill="#fff" fill-opacity="0.85"/><text x="270.0" y="788.0" font-size="11" text-anchor="middle" fill="#241A52">18. Tampilkan hasil, panel diperbarui</text><rect x="40" y="500" width="1080" height="256" rx="0" fill="none" stroke="#8F86C9" stroke-width="1.5"/><rect x="40" y="500" width="48" height="22" rx="0" fill="#E9E3FF" stroke="#8F86C9" stroke-width="1.5"/><text font-size="11" font-weight="700" fill="#241A52" text-anchor="middle"><tspan x="64.0" y="514.9">alt</tspan></text><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="94" y="514.9">[admin menyetujui bukti]</tspan></text><path d="M40.0 632.0 L1120.0 632.0" fill="none" stroke="#8F86C9" stroke-width="1.6" stroke-dasharray="6 5"/><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="46" y="647.9">[admin menolak bukti]</tspan></text><text font-size="11" fill="#6B6590" text-anchor="start"><tspan x="40" y="842.0">Hanya pembayaran berstatus Verifikasi yang bisa diproses; yang sudah diproses ditolak sistem (409).</tspan></text></svg>